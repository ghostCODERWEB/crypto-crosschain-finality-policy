[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-crosschain-finality-policy"
version = "0.1.0"
description = "Evaluate transfer maturity against source depth, challenge windows and explicit chain halts."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-crosschain-finality-policy = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
